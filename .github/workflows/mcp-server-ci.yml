name: MCP Server CI & Release

on:
  push:
    branches:
      - main
    paths:
      - "mcp-server/**"
  pull_request:
    branches:
      - main
    paths:
      - "mcp-server/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "mcp-server/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff (Formatting)
        run: uv run ruff format --check .

      - name: Run Ruff (Linting)
        run: uv run ruff check .

      - name: Run Pytest
        run: uv run pytest

  release-and-publish:
    needs: test
    if: github.ref_name == 'main'
    name: Semantic Release, PyPI & MCP Registry Publish
    runs-on: ubuntu-latest
    concurrency: release
    environment:
      name: pypi
      url: https://pypi.org/p/getme-mcp-server
    permissions:
      id-token: write # Required for OIDC PyPI & MCP Registry publishing
      contents: write # Required for pushing commits and tags

    defaults:
      run:
        working-directory: ./mcp-server

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        id: semantic_release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: mcp-server

      - name: Install uv
        if: steps.semantic_release.outputs.released == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        if: steps.semantic_release.outputs.released == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: "mcp-server/pyproject.toml"

      - name: Build package
        if: steps.semantic_release.outputs.released == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.semantic_release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-server/dist

      - name: Install mcp-publisher
        if: steps.semantic_release.outputs.released == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Set version in server.json
        if: steps.semantic_release.outputs.released == 'true'
        run: |
          VERSION=${{ steps.semantic_release.outputs.version }}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate and Publish to MCP Registry
        if: steps.semantic_release.outputs.released == 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
