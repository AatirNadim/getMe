[project]
name = "getme-mcp-server"
version = "0.1.0"
description = "MCP server for getMe (HTTP over Unix domain socket)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
getme-mcp-server = "getme_mcp_server.__main__:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.16",
]

[tool.hatch.build.targets.wheel]
packages = ["getme_mcp_server"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"


[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
version_variables = [
    "getme_mcp_server/__init__.py:__version__"
]
tag_format = "mcp-server-v{version}"
commit_parser = "angular"
commit_message = "chore(mcp-server): release v{version}"
changelog_file = "CHANGELOG.md"
